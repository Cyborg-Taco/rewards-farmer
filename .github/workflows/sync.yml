name: Sync Fork

on:
  schedule:
    - cron: '15 0 * * *' # Runs automatically every day at 12:15 AM UTC
  workflow_dispatch:   # Allows you to click a button to run it manually

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync with OG Repo
        run: gh repo sync ${{ github.repository }} --branch ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
